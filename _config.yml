title: Myreen Repizo
email: myreenrepizo@gmail.com
description: >-
  Information security consultant specializing in SOC 2, ISO 27001,
  GRC, and compliance automation. CISSP, CISM, CISA certified. Based in the Philippines,
  serving clients globally.
baseurl: ""
url: "https://myreenrepizo.github.io"

author: Myreen Repizo

# SEO
lang: en
timezone: Asia/Manila

# Social
github_username: myreenrepizo
linkedin_username: myreen-repizo

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
header_pages:
  - about.md
  - services.md
  - portfolio.md
  - blog.md
  - contact.md

# Minima theme settings
minima:
  skin: classic

# SEO tag defaults
twitter:
  card: summary

# Collections for portfolio
collections:
  portfolio_items:
    output: true
    permalink: /portfolio/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Myreen Repizo"
  - scope:
      path: ""
      type: "portfolio_items"
    values:
      layout: "default"
